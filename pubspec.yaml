name: chatly_chat
description: Free Flutter chat UI template in the style of WhatsApp. Voice and video call screens, image, voice message and location sharing, read receipts.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  record: ^6.0.0
  audioplayers: ^6.1.0
  geolocator: ^13.0.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
